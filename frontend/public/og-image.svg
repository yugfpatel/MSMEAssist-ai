    <line x1="120" y1="0" x2="120" y2="630" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8" />
