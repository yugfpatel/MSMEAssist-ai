  <rect x="120" y="375" width="290" height="155" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="145" y="415" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#86868b" letter-spacing="1">COLONY TELEMETRY</text>
  <text x="145" y="460" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="700" fill="#30d158">98.4%</text>
  <text x="145" y="495" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="400" fill="#86868b">Optimum Hive Condition</text>

